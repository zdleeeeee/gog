backend:
  name: github
  repo: zdleeeeee/gog
  branch: main

site_url: https://zdleeeeee.github.io/gog/

output:
  omit_empty_optional_fields: true

media_folder: static/uploads
public_folder: /uploads

collections:
  # Share page-bundle options and fields; only labels and paths vary below.
  - &page_bundle
    
    name: basic
    label: 基础设定
    folder: content/lore/basic
    create: true
    delete: false

    format: toml-frontmatter
    extension: md
    path: "{{slug}}/index"

    # All lore collections share this media tree. Enter the region and article
    # subfolders before uploading; do not register regions as separate media roots.
    media_folder: /content/lore/basic
    public_folder: /lore/basic

    editor:
      preview: false

    fields:
      - { name: title, label: 标题, widget: string }
      - { name: date, label: 日期, widget: datetime }
      - { name: draft, label: 草稿, widget: boolean, default: true }
      - { name: summary, label: 摘要, widget: text, required: false }
      - { name: tags, label: 标签, widget: list, required: false }
      - { name: ShowToc, label: 显示目录, widget: boolean, default: true, required: false }
      - { name: ShowBreadCrumbs, label: 显示面包屑导航, widget: boolean, default: true, required: false }
      - { name: weight, label: 排序权重（较小优先，0 为默认）, widget: number, value_type: int, required: false }
      - { name: layout, label: 布局（留空使用默认）, widget: string, required: false }

      - name: author
        label: 作者
        widget: list
        required: false
        fields:
          - { name: name, label: 姓名, widget: string }
          - { name: url, label: 作者链接, widget: string, required: false }

      - name: cover
        label: 封面
        widget: object
        required: false
        collapsed: true
        fields:
          - name: image
            label: 图片
            widget: image
            required: false
          - { name: alt, label: 替代文字, widget: string, required: false }
          - { name: source, label: 来源链接, widget: string, required: false }
          - { name: caption, label: 封面说明, widget: string, required: false }
          - { name: hiddenInList, label: 在列表和目录卡片中隐藏封面, widget: boolean, required: false }
          - { name: hiddenInSingle, label: 在文章页中隐藏封面, widget: boolean, required: false }

      - name: body
        label: 正文
        widget: markdown
        modes: [raw]

  - <<: *page_bundle
    name: westnor
    label: 西方大陆-北
    folder: content/lore/westnor
    media_folder: /content/lore/westnor
    public_folder: /lore/westnor

  - <<: *page_bundle
    name: east
    label: 东方大陆
    folder: content/lore/east
    media_folder: /content/lore/east
    public_folder: /lore/east

  - <<: *page_bundle
    name: westsou
    label: 西方大陆-南
    folder: content/lore/westsou
    media_folder: /content/lore/westsou
    public_folder: /lore/westsou

  - <<: *page_bundle
    name: souisland
    label: 南环诸岛
    folder: content/lore/souisland
    media_folder: /content/lore/souisland
    public_folder: /lore/souisland

  - <<: *page_bundle
    name: works
    label: 作品
    folder: content/works
    media_folder: /content/works
    public_folder: /works

  - <<: *page_bundle
    name: about
    label: 关于
    folder: content/about
    media_folder: /content/about
    public_folder: /about

  - <<: *page_bundle
    name: lore
    label: 设定
    folder: content/lore
    path: "{{slug}}/_index"

    media_folder: /content/lore
    public_folder: /lore

    fields:
      - { name: title, label: 标题, widget: string }
      - { name: date, label: 日期, widget: datetime }
      - { name: draft, label: 草稿, widget: boolean, default: true }
      - { name: summary, label: 摘要, widget: text, required: false }
      - { name: ShowBreadCrumbs, label: 显示面包屑导航, widget: boolean, default: true, required: false }
      - { name: weight, label: 排序权重（较小优先，0 为默认）, widget: number, value_type: int, required: false }
      - { name: layout, label: 布局（留空使用默认）, widget: string, required: false }

      - name: cover
        label: 封面
        widget: object
        required: false
        collapsed: true
        fields:
          - name: image
            label: 图片
            widget: image
            required: false
          - { name: alt, label: 替代文字, widget: string, required: false }
          - { name: source, label: 来源链接, widget: string, required: false }
          - { name: caption, label: 封面说明, widget: string, required: false }
          - { name: hiddenInList, label: 在列表和目录卡片中隐藏封面, widget: boolean, required: false }
          - { name: hiddenInSingle, label: 在文章页中隐藏封面, widget: boolean, required: false }

      - name: body
        label: 正文
        widget: markdown
        modes: [raw]
        required: false